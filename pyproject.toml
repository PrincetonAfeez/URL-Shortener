[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sniplink"
version = "0.1.0"
description = "Networking-and-protocols URL shortener: one engine, multiple front ends (CLI, raw HTTP socket, WSGI, Django, JSON API, asyncio health-checker)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "sniplink contributors" }]
keywords = ["url-shortener", "http", "wsgi", "django", "asyncio", "capstone"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "django>=5.0,<6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-django>=4.7",
    "ruff>=0.4",
    "mypy>=1.10",
    "django-stubs>=5.0",
]

[project.scripts]
sniplink = "sniplink.cli.main:main"

[project.urls]
Documentation = "./docs"
Issues = "./docs/planning/timeline.md"

[tool.hatch.build.targets.wheel]
packages = ["src/sniplink"]

# --------------------------------------------------------------------
# Ruff: lint + format. Single source of truth for code style.
# --------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "web", "tests"]
extend-exclude = ["web/sniplink_web/migrations", "web/links/migrations"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # flake8-bugbear
    "SIM",           # flake8-simplify
    "RUF",           # ruff-specific
]
ignore = [
    "E501",  # line length is enforced by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"web/**/migrations/*" = ["E", "F", "W"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --------------------------------------------------------------------
# Mypy: strict on the framework-free core, lenient on Django glue.
# --------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src/sniplink", "web"]
mypy_path = ["src", "web"]
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "sniplink.core.*"
strict = true

[[tool.mypy.overrides]]
# Django app fights strict mypy without django-stubs. Keep checks but relax.
module = ["sniplink_web.*", "links.*"]
ignore_missing_imports = true
disallow_untyped_decorators = false
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# --------------------------------------------------------------------
# Pytest
# --------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=sniplink",
    "--cov-report=term-missing",
    # Portfolio target: 95% aggregate after comprehensive test pass.
    "--cov-fail-under=95",
]
asyncio_mode = "auto"
# DJANGO_SETTINGS_MODULE is intentionally NOT set here. The Django integration
# test (tests/integration/django/test_api_basic.py) bootstraps Django on its own so
# pytest-django can stay an optional dev dep. Setting it project-wide makes
# pytest-django take over DB management and reject the manual migrate fixture
# the test uses.
pythonpath = ["src", "web"]
filterwarnings = [
    # Treat surprise warnings as errors so the suite catches regressions.
    "error",
    # Django stores stat / health-check timestamps as naive when SQLite is
    # the storage and triggers RuntimeWarning at read time. The values are
    # always UTC in practice; suppressing the noise is intentional.
    "ignore::RuntimeWarning:django.db.models.fields",
    # pytest-asyncio is a dev-only dep. When it isn't installed (CI tier,
    # quick local runs) the asyncio_mode setting above produces an
    # "Unknown config option" warning. Harmless — ignore it.
    "ignore::pytest.PytestConfigWarning",
    # SQLite connections finalized during concurrent tests can emit a benign
    # unraisable on Windows — do not fail an otherwise green suite.
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
markers = [
    "concurrency: tests that hammer the storage layer to prove uniqueness races are handled",
    "integration: end-to-end tests that touch sockets, WSGI, or Django",
]

# --------------------------------------------------------------------
# Coverage: branch-aware report on the sniplink package. The 95% gate in
# addopts is the CI floor. CLI modules are included (direct unit tests +
# subprocess integration tests). Django views live under web/ and are
# exercised by tests/integration/django/ but are not in --cov=sniplink.
# --------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["sniplink"]
omit = [
    "src/sniplink/__main__.py",
    "src/sniplink/storage/migrations.py",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pragma: no cover",
]
show_missing = true
precision = 1
