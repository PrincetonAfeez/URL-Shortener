name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install project + dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev]" -c requirements-lock.txt

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Mypy (strict on framework-free core)
        run: python -m mypy src/sniplink/core

      - name: Pytest with coverage (95% gate)
        env:
          PYTHONPATH: src:web
        run: python -m pytest --cov-report=html

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: |
            .coverage
            htmlcov/
          if-no-files-found: ignore

  docker-smoke:
    name: Docker smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sniplink-smoke .

      - name: Smoke run container
        run: |
          set -euo pipefail
          docker run -d --name sniplink-smoke -p 8000:8000 \
            -e SNIPLINK_DJANGO_DEBUG=false \
            -e SNIPLINK_SECRET_KEY=ci-secret \
            -e SNIPLINK_API_KEY=ci-key \
            sniplink-smoke
          trap 'docker logs sniplink-smoke || true; docker rm -f sniplink-smoke || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8000/; then
              curl -fsS -I http://127.0.0.1:8000/
              exit 0
            fi
            sleep 1
          done
          echo "Container did not respond on http://127.0.0.1:8000/ within 30s"
          exit 1
